        .border-cyan { border-color: #64FFDA; }

            background-color: #0A192F;
            border: 1px solid #233554;
            color: #CCD6F6;
            transition: all 0.2s ease;
        }
        .input-custom:focus {
            outline: none;
            border-color: #64FFDA;

            color: #64FFDA;
        }
        
        .btn-primary-ghost {

            border: 1px solid #64FFDA;

            transition: all 0.2s ease;
        }
        .btn-primary-ghost:hover {
            background-color: rgba(100, 255, 218, 0.1);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
        }

        .btn-social {
            background-color: #0A192F;
            border: 1px solid #233554;

<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md bg-level-0">
<!-- Top Navigation (Suppressed for transactional screen, but replacing with minimal logo anchor as requested by prompt "Header: Branding and navigation links from...". However, "The Source of Truth Hierarchy" -> "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up...". I will follow the strict rule and suppress the full shell, providing a focused logo header instead for the transactional context) -->
<header class="w-full py-lg px-gutter max-w-container-max mx-auto flex justify-center lg:justify-start items-center">
<a class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary-fixed flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[32px] md:text-[48px] text-cyan" style="font-variation-settings: 'FILL' 1;">terminal</span>
            DevPortal VN
        </a>
</header>
<!-- Main Registration Content -->
<main class="flex-grow flex items-center justify-center px-gutter py-xl">
<div class="bg-level-1 border border-outline-custom rounded-xl p-lg md:p-xl w-full max-w-md shadow-2xl relative overflow-hidden">
<!-- Subtle accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#64FFDA] to-transparent opacity-50"></div>
<div class="mb-lg text-center">
<h1 class="font-headline-md text-headline-md text-tertiary mb-xs">Tạo tài khoản</h1>
<p class="text-on-surface-variant font-body-md text-body-md">Tham gia cộng đồng lập trình viên Việt Nam.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullname">Họ và tên</label>
<input class="input-custom rounded-lg px-md py-sm font-body-md text-body-md w-full focus:ring-0" id="fullname" placeholder="Nguyễn Văn A" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email</label>
<input class="input-custom rounded-lg px-md py-sm font-body-md text-body-md w-full focus:ring-0" id="email" placeholder="dev@example.com" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Mật khẩu</label>
<input class="input-custom rounded-lg px-md py-sm font-body-md text-body-md w-full focus:ring-0" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="confirm_password">Xác nhận mật khẩu</label>
<input class="input-custom rounded-lg px-md py-sm font-body-md text-body-md w-full focus:ring-0" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 bg-level-0 border-outline-custom rounded text-[#64FFDA] focus:ring-[#64FFDA] focus:ring-offset-0 focus:ring-offset-[#112240] cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant cursor-pointer" for="terms">
                        Tôi đồng ý với <a class="text-cyan hover:underline underline-offset-4 decoration-[#64FFDA]/50" href="term.html">điều khoản và chính sách</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="btn-primary-ghost rounded-lg py-sm px-md font-label-caps text-label-caps uppercase mt-sm w-full flex justify-center items-center gap-sm" type="submit">
                    Đăng ký tài khoản
                    <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
<div class="my-lg flex items-center justify-between">
<hr class="w-full border-outline-custom"/>
<span class="px-md text-on-surface-variant font-label-caps text-label-caps uppercase whitespace-nowrap">Hoặc tiếp tục với</span>
<hr class="w-full border-outline-custom"/>
</div>
<div class="flex flex-col gap-sm">
<button class="btn-social rounded-lg py-sm px-md font-body-md text-body-md w-full flex justify-center items-center gap-sm" type="button">
<img alt="Google" class="w-5 h-5 rounded-full object-cover bg-white p-0.5" src="https://lh3.googleusercontent.com/aida/AEtjO1Uagkw7_myIRUNjtOsN1mU17sig7GZLfCVKsMs5QWxB7GcJK5i_xtd6L8ra3-6UHW3HHOCmeuYd9N_eto5_B_NVHKSH-bhKTKmbLK7weWDgpuEXMcHlhJS4xDYUbpQ7a1a1Op62ZEEeoSfr-9tCL0s_5ScQNjzu9x29c5BvXvfDVSbIANFtgn-E88dTiNDcJTU0g2M2HT8M6fmpX2PSTn2KccnDzy5DkF_ULRwSKRyP9i7uIhYaXp28pf2M"/>
                    Google
                </button>
<button class="btn-social rounded-lg py-sm px-md font-body-md text-body-md w-full flex justify-center items-center gap-sm" type="button">
<img alt="GitHub" class="w-5 h-5 rounded-full object-cover bg-white p-0.5" src="https://lh3.googleusercontent.com/aida/AEtjO1V0qQT7cB16o87KZp8Tz1UBHC-Ze03MYPsIXO5vcd_jKEkQ_lAs7qwOTR-O17BbGBlhTm1J4potlM617lfWun6MBVCc0p_AOaHO-5DU7rm2Ksgx4aa4xH5Bw7_OP79MGIaJ4qmbzQJZUWDYtcbDFTMzCvvesHANVFZ8DrnGVzHZWO1NV3gjcxjxJYe9QbTuxM81d7Nr0ZZyexs_ms49-vdcY8ZAznaWgwh17n2Fvti_YbzBLWALayxJFwtu"/>
                    GitHub
                </button>
</div>
<div class="mt-lg text-center">
<p class="text-on-surface-variant font-body-md text-body-md">
                    Đã có tài khoản? 
                    <a class="text-[#CCD6F6] hover:text-cyan hover:underline decoration-cyan underline-offset-4 transition-colors font-headline-md text-[16px] font-normal" href="#">Đăng nhập</a>
</p>
</div>
</div>
</main>
</body></html>
